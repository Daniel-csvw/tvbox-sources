name: Auto Update TVBox Sources

on:
  schedule:
    # 每天凌晨 3:30 UTC = 北京 11:30
    - cron: '30 3 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full TVBox analysis
        run: |
          python3 scripts/tvbox_analyze.py --outdir . --timeout 12 --workers 6
          # urls.md 是全量有效源（每行一个完整 URL），拷贝为 sources.txt
          cp urls.md sources.txt
          echo "有效源数量：$(wc -l < sources.txt)"

      - name: Update status.json
        run: |
          python3 - << 'PYEOF'
          import json, time
          with open('sources.txt') as f:
              urls = [u.strip() for u in f if u.strip().startswith('http')]
          status = {
              'updated_at': time.strftime('%Y-%m-%d %H:%M', time.gmtime(time.time() + 8*3600)),
              'total': len(urls),
              'valid': len(urls),
              'invalid': 0
          }
          with open('status.json', 'w') as f:
              json.dump(status, f, ensure_ascii=False)
          print('status.json 已更新:', status)
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name "QwenPaw Bot"
          git config user.email "qwenpaw@users.noreply.github.com"
          git add sources.txt status.json urls.md report.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日自动更新：$(date +%Y-%m-%d) 有效源 $(wc -l < sources.txt) 个"
            git push
          fi
